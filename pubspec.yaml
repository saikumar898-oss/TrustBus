name: my_first_app
description: TrustBus Enterprise App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2

  # ✅ Moved from dev_dependencies
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10   # ← Add this for web support
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1   # ← This one correctly stays here

flutter_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/logo/trustbuslogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/